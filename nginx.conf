server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # .mjs is not in the default Nginx MIME map on some images.
    # ES modules must be served with a JavaScript MIME type.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
