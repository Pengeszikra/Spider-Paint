name: Production MCP workshop smoke
on:
  push:
    paths:
      - 'tests/production-workshop-smoke.mjs'
      - '.github/workflows/production-workshop-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/production-workshop-smoke.mjs
